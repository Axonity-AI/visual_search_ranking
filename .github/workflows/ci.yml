name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  secrets:
    name: secrets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
      - name: Run gitleaks
        run: gitleaks detect --source . --redact -v

  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Install CPU-only PyTorch for faster CI
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          # requirements.txt pins plain torch==2.1.1 (no +cpu suffix), which
          # pip treats as a *different* version from what was just installed
          # -- installing it with --no-deps would silently replace the CPU
          # build with the CUDA build (missing its CUDA-lib dependencies,
          # since --no-deps skips those too), breaking `import torch` at
          # runtime. Exclude torch/torchvision from this pass so the CPU
          # install from above is never touched again.
          grep -v -E '^(torch|torchvision)(==|>=|$)' requirements.txt > requirements-ci.txt
          pip install -r requirements-ci.txt --no-deps
          pip install fastapi uvicorn pydantic python-dotenv numpy scikit-learn pillow tqdm requests
          pip install pytest pytest-cov pytest-asyncio flake8

      - name: Run linting
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 src/ tests/ --count --select=E9,F63,F7,F82 --show-source --statistics
          # Exit-zero treats all errors as warnings
          flake8 src/ tests/ --count --exit-zero --max-complexity=10 --max-line-length=120 --statistics
        continue-on-error: true

      - name: Run tests
        run: |
          PYTHONPATH=src pytest tests/ -v --cov=src/visual_search_ranking --cov-report=xml
        continue-on-error: false

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false
        continue-on-error: true

  docker:
    runs-on: ubuntu-latest
    # Don't require tests to pass for docker build during development
    # needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Extra headroom on top of the torch CPU-only fix above -- GitHub's
      # runners ship ~14GB free with a lot of preinstalled tooling this
      # build never uses (Android SDK, .NET, Haskell, CodeQL).
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          docker system prune -af || true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          push: false
          load: true
          tags: visual-search-ranking:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  code-quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install black flake8 isort

      - name: Check formatting with black
        run: black --check src/ tests/ --line-length 120
        continue-on-error: true

      - name: Check import sorting with isort
        run: isort --check-only src/ tests/
        continue-on-error: true
