version: '3.8'

services:
  weaviate:
    image: semitechnologies/weaviate:1.24.1
    container_name: enterprise-visual-search-weaviate
    ports:
      - "8080:8080"
      - "50051:50051"
    environment:
      # Query defaults
      QUERY_DEFAULTS_LIMIT: 25

      # Authentication (disabled for local dev)
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: 'true'

      # Persistence
      PERSISTENCE_DATA_PATH: '/var/lib/weaviate'

      # Cluster configuration
      CLUSTER_HOSTNAME: 'node1'

      # Resource limits
      LIMIT_RESOURCES: 'false'

      # Enable modules (none needed for our custom embeddings)
      ENABLE_MODULES: ''

      # Auto-schema
      AUTO_SCHEMA_ENABLED: 'true'

      # CORS
      ORIGIN: '*'

    volumes:
      - weaviate_data:/var/lib/weaviate
    restart: on-failure:0
    networks:
      - visual-search-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/v1/.well-known/ready"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

volumes:
  weaviate_data:
    driver: local

networks:
  visual-search-network:
    driver: bridge
